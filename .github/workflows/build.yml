name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Set up Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3

      - name: 4. Ensure Executable Permissions & Build APK
        run: |
          # Automatically find where build.gradle lives in case of subfolder nesting
          PROJECT_DIR=$(find . -maxdepth 3 -name "build.gradle" -not -path "*/app/*" -exec dirname {} \;)
          if [ -n "$PROJECT_DIR" ]; then
            cd "$PROJECT_DIR"
          fi

          # Grant execution permissions to gradlew if present
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: 5. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LegacyFitnessTracker-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
